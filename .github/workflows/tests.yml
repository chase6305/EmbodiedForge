name: Tests

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.10'
            extras: train,test,viz-web
          - python-version: '3.12'
            extras: train,test,viz-web,mjbatch
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install core, CPU training and Web test dependencies
        run: |
          python -m pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[${{ matrix.extras }}]' build
      - name: Check source and test style
        run: |
          ruff check src tests benchmarks examples
          ruff format --check src tests benchmarks examples
      - name: Run tests
        env:
          # This job does not install the external H1 MJCF. Keep optional asset
          # probes in a writable directory instead of a runner's unrelated home.
          EF_H1_MODEL: ${{ runner.temp }}/embodiedforge-unconfigured-h1.xml
        run: python -m pytest -q
      - name: Build distributions and verify source archive
        run: |
          python -m build
          python - <<'PY'
          import subprocess
          import sys
          import tarfile
          import tempfile
          from pathlib import Path

          archive = next(Path("dist").glob("*.tar.gz"))
          with tempfile.TemporaryDirectory(prefix="embodiedforge-sdist-") as temporary:
              with tarfile.open(archive) as source:
                  assert not any(
                      "/docs/experiments/" in member.name
                      and member.name.endswith(".tar.gz")
                      for member in source.getmembers()
                  ), "Source release includes historical evidence archives"
                  source.extractall(temporary)
              root = next(Path(temporary).iterdir())
              subprocess.run(
                  [sys.executable, "-m", "pytest", "-q",
                   "tests/test_documentation.py", "tests/test_architecture.py"],
                  cwd=root, check=True,
              )
          PY
      - name: Verify installed wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -I -m embodiedforge plan --task hold --num-envs 2
          python -I -c "from importlib.resources import files; root = files('embodiedforge'); assert (root / 'viewers/web.html').is_file(); assert (root / 'viewers/web.js').is_file(); assert (root / 'locomotion/microduck/robot/microduck/robot_walk.xml').is_file(); assert (root / 'locomotion/microduck/robot/microduck/assets/bearing_roll.stl').is_file()"
