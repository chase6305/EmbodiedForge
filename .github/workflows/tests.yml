name: Tests

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install core, CPU training and Web test dependencies
        run: |
          python -m pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[train,test,viz-web]' build
      - name: Check source and test style
        run: |
          ruff check src tests benchmarks examples
          ruff format --check src tests benchmarks examples
      - name: Run tests
        run: python -m pytest -q
      - name: Build and verify installed wheel
        run: |
          python -m build --wheel
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -I -m embodiedforge plan --task hold --num-envs 2
          python -I -c "from importlib.resources import files; root = files('embodiedforge'); assert (root / 'viewers/web.html').is_file(); assert (root / 'viewers/web.js').is_file(); assert (root / 'locomotion/microduck/robot/microduck/robot_walk.xml').is_file(); assert (root / 'locomotion/microduck/robot/microduck/assets/bearing_roll.stl').is_file()"
